<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ThisApp</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0175c2;
        color: white;
        font-family: Arial, sans-serif;
      }
      .loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        background: #0175c2;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top: 5px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .fade-out {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p style="margin-top: 20px">正在加载...</p>
    </div>

    <script>
      // 必需的构建配置 - 使用新的初始化方式
      window._flutter = {
        buildConfig: {
          engineRevision: "ef0cd000916d64fa0c5d09cc809fa7ad244a5767",
          builds: [
            {
              compileTarget: "dart2js",
              renderer: "canvaskit",
              mainJsPath: "main.dart.js",
            },
          ],
        },
      };

      // 隐藏加载页面的函数
      function hideLoadingScreen() {
        const loading = document.getElementById("loading");
        loading.classList.add("fade-out");
        setTimeout(() => {
          loading.style.display = "none";
        }, 300);
      }
    </script>

    <script>
      // 等待flutter_bootstrap.js加载完成后执行
      function initFlutter() {
        if (typeof _flutter !== "undefined" && _flutter.loader) {
          _flutter.loader.load({
            serviceWorkerSettings: {
              serviceWorkerVersion: "629770274",
            },
            onEntrypointLoaded: function (engineInitializer) {
              console.log("✅ Flutter引擎初始化完成");

              // 监听Flutter应用加载完成
              engineInitializer
                .initializeEngine({
                  // 配置本地字体服务器地址
                  fontFallbackBaseUrl: window.location.origin + "/xxx/",
                })
                .then(function (appRunner) {
                  console.log("✅ Flutter应用准备运行");

                  // 隐藏加载页面
                  hideLoadingScreen();

                  // 运行Flutter应用
                  return appRunner.runApp();
                })
                .catch(function (error) {
                  console.error("❌ Flutter应用加载失败:", error);
                  // 即使出错也隐藏加载页面，显示错误信息
                  hideLoadingScreen();
                });
            },
          });
        } else {
          // 如果还未加载，稍后重试
          setTimeout(initFlutter, 100);
        }
      }

      // 在页面加载完成后初始化
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initFlutter);
      } else {
        initFlutter();
      }
    </script>

    <script src="flutter_bootstrap.js" defer></script>
  </body>
</html>
