<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A Flutter chat application.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ThisApp">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ThisApp</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- 简化字体CSS -->
  <link rel="stylesheet" href="fonts.css" type="text/css">
  
  <!-- MiniTex免字体渲染器 -->
  <script src="minitex.min.js"></script>
  
  <!-- 启动屏样式 -->
  <style>
    /* 启动屏容器 */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0175C2 0%, #1565C0 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-in-out;
    }
    
    /* Logo容器 */
    .logo-container {
      text-align: center;
      margin-bottom: 40px;
    }
    
    /* 应用图标 */
    .app-icon {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
      animation: logoFloat 2s ease-in-out infinite alternate;
    }
    
    /* Logo浮动动画 */
    @keyframes logoFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    
    /* 应用名称 */
    .app-name {
      color: white;
      font-size: 32px;
      font-weight: 600;
      margin: 0;
      font-family: 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    
    /* 应用标语 */
    .app-tagline {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      margin: 8px 0 0 0;
      font-family: 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
    }
    
    /* 加载动画容器 */
    .loading-animation {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
    }
    
    /* 加载圆点 */
    .loading-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      margin: 0 6px;
      animation: loadingBounce 1.4s ease-in-out infinite both;
    }
    
    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }
    .loading-dot:nth-child(3) { animation-delay: 0s; }
    
    @keyframes loadingBounce {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }
    
    /* 加载文本 */
    .loading-text {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      margin-top: 20px;
      font-family: 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
      animation: loadingTextPulse 2s ease-in-out infinite;
    }
    
    @keyframes loadingTextPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    
    /* 版本信息 */
    .version-info {
      position: absolute;
      bottom: 30px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-family: 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
    }
    
    /* 隐藏启动屏 */
    .loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
      .app-icon {
        width: 100px;
        height: 100px;
      }
      
      .app-name {
        font-size: 28px;
      }
      
      .app-tagline {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <!-- 启动屏 -->
  <div id="loading-screen" class="loading-container">
    <div class="logo-container">
      <img src="icons/Icon-192.png" alt="ThisApp" class="app-icon">
      <h1 class="app-name">ThisApp</h1>
      <p class="app-tagline">安全高效的即时通讯</p>
    </div>
    
    <div class="loading-animation">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
    
    <div class="loading-text">正在加载应用...</div>
    
    <div class="version-info">版本 1.0.2</div>
  </div>

  <script>
    console.log('🔍 Flutter Web - 完全本地化版本');
    
    // 启动屏管理
    window.addEventListener('load', function() {
      // 当Flutter应用加载完成后隐藏启动屏
      const hideLoadingScreen = () => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.classList.add('fade-out');
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500);
        }
      };
      
      // 监听Flutter应用就绪事件
      window._flutter = window._flutter || {};
      window._flutter.loader = window._flutter.loader || {};
      
      // 设置最小显示时间（确保用户能看到启动屏）
      let minDisplayTime = new Promise(resolve => setTimeout(resolve, 1500));
      let flutterReady = false;
      
      // 当Flutter准备就绪时
      const checkFlutterReady = () => {
        if (window.flutterCanvasKit || document.querySelector('flutter-view')) {
          flutterReady = true;
          minDisplayTime.then(hideLoadingScreen);
        } else {
          setTimeout(checkFlutterReady, 100);
        }
      };
      
      // 开始检查Flutter状态
      setTimeout(checkFlutterReady, 500);
      
      // 兜底机制：5秒后强制隐藏启动屏
      setTimeout(() => {
        if (!flutterReady) {
          console.log('⏰ 启动屏显示超时，强制隐藏');
          hideLoadingScreen();
        }
      }, 5000);
    });
  </script>
  
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
