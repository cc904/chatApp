<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ThisApp</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        overflow: hidden;
      }
      .loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .loading-container {
        position: relative;
        width: 50px;
        height: 50px;
        margin: 25px 0;
      }
      .loading-circle {
        position: absolute;
        border-radius: 50%;
        border: 2px solid transparent;
      }
      .circle-outer {
        width: 50px;
        height: 50px;
        border-top-color: #fff;
        animation: spin 1.5s linear infinite;
      }
      .circle-middle {
        width: 38px;
        height: 38px;
        top: 6px;
        left: 6px;
        border-right-color: #fff;
        animation: spin 1.2s linear infinite reverse;
        opacity: 0.7;
      }
      .circle-inner {
        width: 25px;
        height: 25px;
        top: 12.5px;
        left: 12.5px;
        border-bottom-color: #fff;
        animation: spin 1s linear infinite;
        opacity: 0.5;
      }
      .pulse-dot {
        position: absolute;
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
        top: 21px;
        left: 21px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .loading-text {
        font-size: 18px;
        font-weight: 300;
        letter-spacing: 2px;
        animation: fadeInOut 2s ease-in-out infinite;
      }
      .loading-tip {
        font-size: 14px;
        font-weight: 300;
        opacity: 0.8;
        margin-top: 25px;
        animation: fadeInOut 3s ease-in-out infinite;
      }
      .app-icon {
        margin-bottom: 20px;
        animation: fadeInOut 2s ease-in-out infinite;
      }
      .app-icon img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
      }
      .app-name {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 0;
        letter-spacing: 1px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      }
      .loading-dots::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.8); opacity: 0.5; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      @keyframes fadeInOut {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes dots {
        0%, 20% { content: ''; }
        40% { content: '.'; }
        60% { content: '..'; }
        80%, 100% { content: '...'; }
      }
      .fade-out {
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">
      <div class="app-icon">
        <img src="icons/Icon-192.png" alt="ThisApp" />
      </div>
      <div class="app-name">ThisApp</div>
      <div class="loading-container">
        <div class="loading-circle circle-outer"></div>
        <div class="loading-circle circle-middle"></div>
        <div class="loading-circle circle-inner"></div>
        <div class="pulse-dot"></div>
      </div>
      <div class="loading-tip">
        正在为您准备安全的聊天体验...
      </div>
    </div>

    <script>
      // 必需的构建配置 - 使用新的初始化方式
      window._flutter = {
        buildConfig: {
          engineRevision: "ef0cd000916d64fa0c5d09cc809fa7ad244a5767",
          builds: [
            {
              compileTarget: "dart2js",
              renderer: "canvaskit",
              mainJsPath: "main.dart.js",
            },
          ],
        },
      };

      // 隐藏加载页面的函数
      function hideLoadingScreen() {
        const loading = document.getElementById("loading");
        loading.classList.add("fade-out");
        setTimeout(() => {
          loading.style.display = "none";
        }, 300);
      }
    </script>

    <script>
      // 等待flutter_bootstrap.js加载完成后执行
      function initFlutter() {
        if (typeof _flutter !== "undefined" && _flutter.loader) {
          _flutter.loader.load({
            serviceWorkerSettings: {
              serviceWorkerVersion: "629770274",
            },
            onEntrypointLoaded: function (engineInitializer) {
              console.log("✅ Flutter引擎初始化完成");

              // 监听Flutter应用加载完成
              engineInitializer
                .initializeEngine({
                  // 配置本地字体服务器地址
                  fontFallbackBaseUrl: window.location.origin + "/fonts/",
                  // 配置本地CanvasKit路径，避免从gstatic.com加载
                  canvasKitBaseUrl: window.location.origin + "/canvaskit/",
                })
                .then(function (appRunner) {
                  console.log("✅ Flutter应用准备运行");

                  // 隐藏加载页面
                  hideLoadingScreen();

                  // 运行Flutter应用
                  return appRunner.runApp();
                })
                .catch(function (error) {
                  console.error("❌ Flutter应用加载失败:", error);
                  // 即使出错也隐藏加载页面，显示错误信息
                  hideLoadingScreen();
                });
            },
          });
        } else {
          // 如果还未加载，稍后重试
          setTimeout(initFlutter, 100);
        }
      }

      // 在页面加载完成后初始化
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initFlutter);
      } else {
        initFlutter();
      }
    </script>

    <script src="flutter_bootstrap.js" defer></script>
  </body>
</html>
