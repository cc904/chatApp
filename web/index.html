<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>ThisApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0175C2; color: white; font-family: Arial, sans-serif; }
    .loading { 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: #0175C2;
    }
    .spinner { 
      width: 50px; 
      height: 50px; 
      border: 5px solid rgba(255,255,255,0.3); 
      border-top: 5px solid white; 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .fade-out {
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="margin-top: 20px;">正在加载...</p>
  </div>
  
  <script>
    // 强制使用HTML渲染器避免兼容性问题
    window.flutterWebRenderer = 'html';
    
    // 必需的构建配置
    window._flutter = {
      buildConfig: {
        "engineRevision": "ef0cd000916d64fa0c5d09cc809fa7ad244a5767",
        "builds": [{
          "compileTarget": "dart2js",
          "renderer": "html",
          "mainJsPath": "main.dart.js"
        }]
      }
    };

    // 隐藏加载页面的函数
    function hideLoadingScreen() {
      const loading = document.getElementById('loading');
      loading.classList.add('fade-out');
      setTimeout(() => {
        loading.style.display = 'none';
      }, 300);
    }
  </script>
  
  <script>
    // 字体服务器配置
    const FONT_SERVER_CONFIG = {
      // 本地字体服务器地址
      LOCAL_FONT_SERVER: 'https://popoopoo.com:7000',
      // 需要拦截的谷歌字体域名
      GOOGLE_FONTS_DOMAINS: [
        'fonts.googleapis.com',
        'fonts.gstatic.com',
        'ajax.googleapis.com'
      ]
    };

    // 替换谷歌字体服务器的拦截器
    (function() {
      const originalFetch = window.fetch;
      const originalCreateElement = document.createElement;

      // 拦截fetch请求
      window.fetch = function(input, init) {
        let url = typeof input === 'string' ? input : input.url;
        
        // 替换谷歌字体请求
        FONT_SERVER_CONFIG.GOOGLE_FONTS_DOMAINS.forEach(domain => {
          if (url.includes(domain)) {
            const newUrl = url.replace(domain, FONT_SERVER_CONFIG.LOCAL_FONT_SERVER.replace('http://', ''));
            console.log('🔄 替换字体请求:', url, '->', newUrl);
            url = newUrl;
          }
        });

        if (typeof input === 'string') {
          return originalFetch.call(this, url, init);
        } else {
          return originalFetch.call(this, Object.assign(input, { url }), init);
        }
      };

      // 拦截动态创建link标签
      document.createElement = function(tagName) {
        const element = originalCreateElement.call(this, tagName);
        
        if (tagName.toLowerCase() === 'link') {
          const originalSetAttribute = element.setAttribute;
          element.setAttribute = function(name, value) {
            if (name.toLowerCase() === 'href' && typeof value === 'string') {
              FONT_SERVER_CONFIG.GOOGLE_FONTS_DOMAINS.forEach(domain => {
                if (value.includes(domain)) {
                  const newValue = value.replace(domain, FONT_SERVER_CONFIG.LOCAL_FONT_SERVER.replace('http://', ''));
                  console.log('🔄 替换字体CSS:', value, '->', newValue);
                  value = newValue;
                }
              });
            }
            return originalSetAttribute.call(this, name, value);
          };
        }
        
        return element;
      };

      console.log('✅ 谷歌字体服务器替换已启用');
    })();

    // 动态设置字体服务器地址
    window.setFontServer = function(serverUrl) {
      FONT_SERVER_CONFIG.LOCAL_FONT_SERVER = serverUrl;
      console.log('📝 字体服务器地址已更新为:', serverUrl);
    };
  </script>
  
  <script src="flutter.js" defer></script>
  
  <script>
    window.addEventListener('load', function() {
      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine();
          await appRunner.runApp();
          // 确保Flutter完全加载后隐藏加载页面
          hideLoadingScreen();
        }
      });
    });
  </script>
</body>
</html>
