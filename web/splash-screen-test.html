<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X0X Chat - 启动屏预览</title>
  
  <!-- 启动屏样式 -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
    }
    
    /* 启动屏容器 */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0175C2 0%, #1565C0 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-in-out;
    }
    
    /* Logo容器 */
    .logo-container {
      text-align: center;
      margin-bottom: 40px;
    }
    
    /* 应用图标 */
    .app-icon {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
      animation: logoFloat 2s ease-in-out infinite alternate;
    }
    
    /* Logo浮动动画 */
    @keyframes logoFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    
    /* 应用名称 */
    .app-name {
      color: white;
      font-size: 32px;
      font-weight: 600;
      margin: 0;
      font-family: 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    
    /* 应用标语 */
    .app-tagline {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      margin: 8px 0 0 0;
      font-family: 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
    }
    
    /* 加载动画容器 */
    .loading-animation {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
    }
    
    /* 加载圆点 */
    .loading-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      margin: 0 6px;
      animation: loadingBounce 1.4s ease-in-out infinite both;
    }
    
    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }
    .loading-dot:nth-child(3) { animation-delay: 0s; }
    
    @keyframes loadingBounce {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }
    
    /* 加载文本 */
    .loading-text {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      margin-top: 20px;
      font-family: 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
      animation: loadingTextPulse 2s ease-in-out infinite;
    }
    
    @keyframes loadingTextPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    
    /* 版本信息 */
    .version-info {
      position: absolute;
      bottom: 30px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-family: 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
    }
    
    /* 控制按钮 */
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10000;
    }
    
    .control-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 16px;
      margin: 0 5px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s ease;
    }
    
    .control-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    /* 隐藏启动屏 */
    .loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
      .app-icon {
        width: 100px;
        height: 100px;
      }
      
      .app-name {
        font-size: 28px;
      }
      
      .app-tagline {
        font-size: 14px;
      }
      
      .controls {
        top: 10px;
        right: 10px;
      }
      
      .control-btn {
        padding: 6px 12px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <!-- 控制按钮 -->
  <div class="controls">
    <button class="control-btn" onclick="toggleSplash()">切换显示</button>
    <button class="control-btn" onclick="resetSplash()">重新加载</button>
  </div>

  <!-- 启动屏 -->
  <div id="loading-screen" class="loading-container">
    <div class="logo-container">
      <img src="icons/Icon-192.png" alt="X0X Chat" class="app-icon">
      <h1 class="app-name">X0X Chat</h1>
      <p class="app-tagline">安全高效的即时通讯</p>
    </div>
    
    <div class="loading-animation">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
    
    <div class="loading-text">正在加载应用...</div>
    
    <div class="version-info">版本 1.0.2</div>
  </div>

  <script>
    console.log('🎨 X0X Chat 启动屏预览');
    
    // 控制函数
    function toggleSplash() {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen.classList.contains('fade-out')) {
        loadingScreen.classList.remove('fade-out');
        loadingScreen.style.display = 'flex';
      } else {
        loadingScreen.classList.add('fade-out');
        setTimeout(() => {
          loadingScreen.style.display = 'none';
        }, 500);
      }
    }
    
    function resetSplash() {
      const loadingScreen = document.getElementById('loading-screen');
      loadingScreen.classList.remove('fade-out');
      loadingScreen.style.display = 'flex';
    }
    
    // 自动演示：3秒后开始淡出
    setTimeout(() => {
      console.log('🎭 启动屏演示：开始淡出');
      toggleSplash();
    }, 3000);
  </script>
</body>
</html>
