syntax = "proto3";

package cc;

// 使用完整路径导入
import "message.proto";

// 会话类型枚举，匹配数据库模型
enum ConversationType {
  private = 0;
  group = 1;
}

// 会话信息
message ConversationProto {
  // 主要字段，完全匹配数据库模型
  string conversation_id = 1;     // 对应 conversationId
  string name = 2;                // 对应 name
  string avatar = 3;              // 对应 avatar
  ConversationType type = 4;      // 对应 type
  int64 created_at = 5;           // 对应 createdAt
  int64 last_message_time = 6;    // 对应 lastMessageTime
  string last_message_preview = 7; // 对应 lastMessagePreview
  int32 unread_count = 8;         // 对应 unreadCount
  string contact_user_id = 9;     // 对应 contactUserId
  
  // 参与者ID，对应数据库中的links
  repeated string participant_ids = 10;
  
  // 扩展字段，用于通信但数据库中可能没有
  int64 updated_at = 11;
  string last_message_id = 12;
  bool muted = 13;
  bool pinned = 14;
  string created_by = 15;
  MessageProto last_message = 16;  // 最后一条消息对象
}

// 会话更新
message ConversationUpdate {
  string conversation_id = 1;
  string name = 2;
  string avatar = 3;
  repeated string participant_ids = 4;
  int64 updated_at = 5;
  string updated_by = 6;
  string action = 7; // 更新动作：add_member, remove_member, change_title, etc.
}

// 会话请求响应
message ConversationResponse {
  bool success = 1;
  string message = 2;
  ConversationProto conversation = 3;
}

// 会话列表
message ConversationCollection {
  repeated ConversationProto conversations = 1;
} 