syntax = "proto3";

package cc;

// 认证操作类型
enum AuthOperationType {
  login = 0;           // 登录
  register = 1;        // 注册
  reset_password = 2;  // 重置密码
  send_code = 3;       // 发送验证码
}

// 认证请求结构
message AuthRequest {
  AuthOperationType operation_type = 1;  // 操作类型
  string phone_number = 2;              // 手机号
  optional string password = 3;         // 密码
  optional string verification_code = 4; // 验证码
  optional string nickname = 5;         // 昵称
  optional bool is_quick_login = 6;     // 是否快速登录
  optional string purpose = 7;          // 验证码用途
}

// 认证响应结构
message AuthResponse {
  bool success = 1;                    // 是否成功
  string message = 2;                  // 提示信息
  optional string user_id = 3;         // 用户ID
  optional string token = 4;           // 认证令牌
  int64 timestamp = 5;                 // 时间戳
}

// 登录请求
message LoginRequest {
  string phone_number = 1;             // 手机号
  oneof auth_method {
    string password = 2;               // 密码
    string verification_code = 3;      // 验证码
  }
  bool is_quick_login = 4;             // 是否快速登录
}

// 注册请求
message RegisterRequest {
  string phone_number = 1;             // 手机号
  string verification_code = 2;        // 验证码
  string password = 3;                 // 密码
  string nickname = 4;                 // 昵称
}

// 密码重置请求
message ResetPasswordRequest {
  string phone_number = 1;             // 手机号
  string verification_code = 2;        // 验证码
  string new_password = 3;             // 新密码
}

// 验证码发送请求
message SendCodeRequest {
  string phone_number = 1;             // 手机号
  string purpose = 2;                  // 用途 (login/register/reset)
}

// 验证码发送响应
message SendCodeResponse {
  bool success = 1;                    // 是否成功
  string message = 2;                  // 提示信息
  int64 timestamp = 3;                 // 时间戳
  int32 cooldown = 4;                  // 冷却时间（秒）
}

// 用户会话信息
message UserSession {
  string user_id = 1;                  // 用户ID
  string token = 2;                    // 认证令牌
  int64 expire_time = 3;               // 过期时间
  string phone_number = 4;             // 手机号
} 