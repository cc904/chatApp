<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Safari兼容性测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Flutter Web Safari兼容性测试</h1>
    
    <div id="test-results"></div>
    
    <script>
        const results = document.getElementById('test-results');
        
        function addTest(name, success, message) {
            const div = document.createElement('div');
            div.className = `status ${success ? 'success' : 'error'}`;
            div.innerHTML = `<strong>${name}:</strong> ${success ? '✅ 通过' : '❌ 失败'} ${message || ''}`;
            results.appendChild(div);
        }
        
        // 测试1: 基本JavaScript加载
        try {
            addTest('JavaScript执行', true, '基本JavaScript功能正常');
        } catch (e) {
            addTest('JavaScript执行', false, e.message);
        }
        
        // 测试2: WebAssembly支持
        if (typeof WebAssembly !== 'undefined') {
            addTest('WebAssembly支持', true, '浏览器支持WebAssembly');
        } else {
            addTest('WebAssembly支持', false, '浏览器不支持WebAssembly');
        }
        
        // 测试3: 跨域资源共享
        fetch('/flutter.js')
            .then(response => addTest('CORS配置', response.ok, `状态码: ${response.status}`))
            .catch(error => addTest('CORS配置', false, error.message));
        
        // 测试4: 字体加载
        fetch('/fonts.css')
            .then(response => addTest('字体CSS加载', response.ok, `状态码: ${response.status}`))
            .catch(error => addTest('字体CSS加载', false, error.message));
    </script>
    
    <h2>测试建议</h2>
    <ol>
        <li>在Safari中打开: <a href="http://localhost:80" target="_blank">http://localhost:80</a></li>
        <li>打开Safari开发者工具 (Option+Command+C)</li>
        <li>查看控制台是否有错误</li>
        <li>检查网络标签页中的资源加载状态</li>
    </ol>
    
    <p>如果仍有问题，请检查Node.js服务日志中的详细信息。</p>
</body>
</html>
