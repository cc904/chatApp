version: '3.8'

services:
  flutter-web-app:
    image: ${REGISTRY_URL:-172.31.46.35:15000/}x0x-chatapp:${IMAGE_TAG:-latest}
    container_name: x0x-chatapp-prod
    restart: unless-stopped
    
    # 端口配置
    ports:
      - "${HOST_PORT:-8080}:${CONTAINER_PORT:-80}"
    
    # 环境变量
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${CONTAINER_PORT:-80}
      - HOST=${HOST:-0.0.0.0}
      - APP_NAME=${APP_NAME:-X0X Chat App}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CONTAINER_PORT:-80}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-1.0}'
          memory: ${MEMORY_LIMIT:-512M}
        reservations:
          cpus: '${CPU_RESERVATION:-0.5}'
          memory: ${MEMORY_RESERVATION:-256M}
    
    # 网络配置
    networks:
      - app-network
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    
    # 标签
    labels:
      - "app=x0x-chatapp"
      - "environment=production"
      - "version=${APP_VERSION:-1.0.0}"
      - "maintainer=dev-team"

# 网络配置
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 可选：如果需要数据持久化
volumes:
  app-logs:
    driver: local