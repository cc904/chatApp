services:
  flutter-web-app:
    image: ${REGISTRY_URL:-nrt.vultrcr.com/ex00/}x0x-chatapp:${IMAGE_TAG:-latest}
    container_name: x0x-chatapp-prod
    restart: unless-stopped
    
    # 端口配置 (仅HTTPS生产环境)
    ports:
      # HTTP端口在生产环境中禁用，确保安全
      # - "${HTTP_PORT:-80}:80"      # HTTP (生产环境禁用)
      - "${HTTPS_PORT:-443}:443"   # HTTPS
    
    # 用户配置已移至Dockerfile中
    
    # 环境变量 (从.env.prod读取并传递给容器)
    # 逻辑: .env.prod文件 → Docker Compose读取 → environment传递 → 容器程序使用
    # 注意: 容器内程序直接使用这些环境变量，不读取.env文件
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - HOST=${HOST:-0.0.0.0}
      - APP_NAME=${APP_NAME:-Chat App}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DISABLE_CORS_HEADERS=${DISABLE_CORS_HEADERS:-false}
      - FONT_SERVICE_URL=${FONT_SERVICE_URL}  # 字体服务地址，由docker-entrypoint.sh生成app-config.json
    # SSL证书挂载
    volumes:
      - "${SSL_CERT_PATH:-../ssl-certs}:/app/ssl-certs:ro"
    
    # 健康检查 (仅HTTPS)
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://127.0.0.1:443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-1.0}'
          memory: ${MEMORY_LIMIT:-512M}
        reservations:
          cpus: '${CPU_RESERVATION:-0.5}'
          memory: ${MEMORY_RESERVATION:-256M}
    
    # 网络配置
    networks:
      - x0x-network
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"

# 网络配置
networks: 
  x0x-network:
    external: true
    driver: bridge
    name: x0x-network