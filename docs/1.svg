graph TD
    Start["用户进入会话"] --> Check{本地消息状态}
    
    Check -->|"无本地消息"| Scene1["场景1: 首次进入"]
    Check -->|"有消息+无未读"| Scene2["场景2: 已读状态"]
    Check -->|"有消息+有未读"| Scene3["场景3: 有未读"]
    
    Scene1 --> Init["请求服务器最新消息"]
    Init --> Display1["显示返回消息"]
    
    Scene2 --> SendCursor["发送本地最新游标"]
    SendCursor --> ServerCheck2["服务器检查新消息"]
    ServerCheck2 --> HasNew{有新消息?}
    
    HasNew -->|"否"| ShowLocal["显示本地最新在底部"]
    HasNew -->|"是"| CheckCount{新消息数量}
    
    CheckCount -->|"不满一页"| Auto1["自动连续<br/>正常显示"]
    CheckCount -->|"满一页+"| CheckCont1{检查连续性}
    
    CheckCont1 -->|"连续"| Normal1["正常显示新消息"]
    CheckCont1 -->|"不连续"| Multi1["多游标状态<br/>上拉填补空档"]
    
    Scene3 --> SendUnread["发送客户端游标<br/>请求未读消息"]
    SendUnread --> ServerCheck3["服务器返回未读消息"]
    ServerCheck3 --> CheckUnreadCont{未读与本地连续?}
    
    CheckUnreadCont -->|"连续"| UnreadNormal["按未读数量正常显示"]
    CheckUnreadCont -->|"不连续"| CheckUnreadCount{未读消息数量}
    
    CheckUnreadCount -->|"满一页+"| Multi2["多游标状态<br/>显示未读消息<br/>标记有空档"]
    CheckUnreadCount -->|"不满一页"| Fill["服务器填补历史<br/>确保连续性"]
    
    UnreadNormal --> UnreadDisplay{未读数量判断}
    UnreadDisplay -->|"> 一页"| UnreadTop["第一条未读在顶部"]
    UnreadDisplay -->|"≤ 一页"| UnreadBottom["最新消息在底部"]
    
    Multi1 --> LoadGap1["上拉时填补空档"]
    Multi2 --> LoadGap2["上拉时填补空档"]
    Fill --> FillDisplay["显示填补后的消息"]
    
    style Scene1 fill:#e3f2fd
    style Scene2 fill:#f3e5f5
    style Scene3 fill:#fff3e0
    style Auto1 fill:#e8f5e8
    style Multi1 fill:#ffebee
    style Multi2 fill:#ffebee