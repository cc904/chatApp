name: Build Android APKs

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # 1) 最小 APK：仅 arm64-v8a
      - name: Build minimal APK (arm64-v8a)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            -PenableAbiSplits=true -PabiInclude=arm64-v8a -PenableUniversalApk=false

      # 2) 兼容 APK：单包包含 arm64-v8a + armeabi-v7a（不使用 --split-per-abi）
      - name: Build compatible APK (arm64-v8a + armeabi-v7a, single APK)
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            -PenableAbiSplits=false

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

name: Build Flutter Android

on:
  push:
    branches: [ 123 ]
  pull_request:
    branches: [ 123 ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android Keystore from Secrets
        # 使用 env 判断，避免在可复用/受限上下文里直接访问 secrets 导致解析失败
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Decoding keystore from secret..."
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/cc-release-key.jks
          echo "Creating key.properties at repo root..."
          cat > key.properties <<PROP
          storeFile=android/app/cc-release-key.jks
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          PROP

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Build Android APK (per-ABI) - Mainstream
        run: flutter build apk --release --split-per-abi

      - name: Build Android Universal APK - Compatibility
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-mainstream
          path: |
            build/app/outputs/flutter-apk/*.apk


      - name: Upload Universal APK (Compatibility)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-compat
          path: build/app/outputs/flutter-apk/app-release.apk


