name: Build Flutter Windows

on:
  push:
    branches: [ 123 ]
  pull_request:
    branches: [ 123 ]
  workflow_dispatch:   # 允许手动触发

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # 1) 检出源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2) 配置 Flutter（缓存可显著提速）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3) 启用 Windows 桌面支持
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # 4) 安装依赖
      - name: Install dependencies
        run: flutter pub get

      # 5) 构建 Windows Release 版本
      - name: Build Windows
        run: flutter build windows --release

      # 6) 安装 NSIS
      - name: Install NSIS
        shell: pwsh
        run: |
          Write-Host "安装 NSIS (支持中文的安装包制作工具)..."
          # 使用 Chocolatey 安装 NSIS
          choco install nsis -y
          
          # 验证安装
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsisPath) {
            Write-Host "✓ NSIS 安装成功"
            
            # 检查 NSIS 版本和插件
            & $nsisPath /VERSION
            
            # 检查中文语言文件
            $nsisLangDir = "C:\Program Files (x86)\NSIS\Contrib\Language files"
            if (Test-Path $nsisLangDir) {
              Write-Host "✓ 语言文件目录存在"
              $chineseFiles = Get-ChildItem $nsisLangDir -Filter "*Chinese*" -Name
              if ($chineseFiles.Count -gt 0) {
                Write-Host "✓ 找到中文语言文件:"
                $chineseFiles | ForEach-Object { Write-Host "  - $_" }
              } else {
                Write-Host "⚠ 未找到中文语言文件"
              }
            }
            
          } else {
            Write-Error "NSIS 安装失败！"
            exit 1
          }

      # 7) 验证构建文件是否存在
      - name: Verify Build Files
        shell: pwsh
        run: |
          if (-not (Test-Path "build\windows\x64\runner\Release\ThisApp.exe")) {
            Write-Error "构建的可执行文件不存在！"
            exit 1
          }
          Write-Host "✓ 构建文件验证通过"

      # 7.5) 安装 VC++ 运行时（便携版依赖）
      - name: Install VC++ Redistributable (vcredist140)
        shell: pwsh
        run: |
          Write-Host "安装 VC++ 运行时 (vcredist140) ..."
          choco install vcredist140 -y
          if ($LASTEXITCODE -ne 0) { Write-Warning "安装 vcredist140 可能失败，继续构建便携版" }
          Write-Host "✓ vcredist140 安装步骤完成"

      # 8) 创建 NSIS 脚本
      - name: Create NSIS Script
        shell: pwsh
        run: |
          Write-Host "创建 NSIS 脚本 (支持中文界面)..."
          
          # 确保输出目录存在
          New-Item -ItemType Directory -Force -Path "build\windows\installer"
          
          # 检查源文件目录
          $sourceDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $sourceDir)) {
            Write-Error "源文件目录不存在: $sourceDir"
            exit 1
          }
          
          Write-Host "源文件目录: $sourceDir"
          Get-ChildItem $sourceDir | ForEach-Object { Write-Host "  - $($_.Name)" }
          
          # 检查中文语言文件是否存在
          $nsisLangDir = "C:\Program Files (x86)\NSIS\Contrib\Language files"
          $chineseLangFile = Join-Path $nsisLangDir "SimpChinese.nlf"
          $hasChineseSupport = Test-Path $chineseLangFile
          
          if ($hasChineseSupport) {
            Write-Host "✓ 将创建支持中英文的安装程序"
            $languageSection = @"
          !include "MUI2.nsh"
          !insertmacro MUI_LANGUAGE "SimpChinese"
          !insertmacro MUI_LANGUAGE "English"
          "@
          } else {
            Write-Host "⚠ 将创建仅支持英文的安装程序"
            $languageSection = @"
          !include "MUI2.nsh"
          !insertmacro MUI_LANGUAGE "English"
          "@
          }
          
          $script = @"
          ; CC Chat NSIS 安装脚本
          ; 支持中文界面的现代化安装程序
          
          !define APP_NAME "CC Chat"
          !define APP_VERSION "1.0.2"
          !define APP_PUBLISHER "CC Team"
          !define APP_URL "https://github.com/your-org/cc"
          !define APP_SUPPORT_URL "https://github.com/your-org/cc/issues"
          !define APP_UPDATES_URL "https://github.com/your-org/cc/releases"
          !define APP_EXE "ThisApp.exe"
          
          ; 安装程序属性
          Name "`${APP_NAME}"
          OutFile "build\windows\installer\cc-chat-setup.exe"
          InstallDir "`$PROGRAMFILES64\`${APP_NAME}"
          InstallDirRegKey HKLM "Software\`${APP_NAME}" "InstallDir"
          RequestExecutionLevel admin
          
          ; 现代化界面
          !include "MUI2.nsh"
          
          ; 界面设置
          !define MUI_ABORTWARNING
          !define MUI_ICON "`${NSISDIR}\Contrib\Graphics\Icons\modern-install.ico"
          !define MUI_UNICON "`${NSISDIR}\Contrib\Graphics\Icons\modern-uninstall.ico"
          
          ; 安装页面
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_LICENSE "LICENSE"
          !insertmacro MUI_PAGE_COMPONENTS
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          
          ; 卸载页面
          !insertmacro MUI_UNPAGE_WELCOME
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_UNPAGE_FINISH
          
          $languageSection
          
          ; 版本信息
          VIProductVersion "`${APP_VERSION}.0"
          VIAddVersionKey "ProductName" "`${APP_NAME}"
          VIAddVersionKey "ProductVersion" "`${APP_VERSION}"
          VIAddVersionKey "CompanyName" "`${APP_PUBLISHER}"
          VIAddVersionKey "LegalCopyright" "© 2024 `${APP_PUBLISHER}"
          VIAddVersionKey "FileDescription" "`${APP_NAME} 安装程序"
          VIAddVersionKey "FileVersion" "`${APP_VERSION}"
          
          ; 安装部分
          Section "`${APP_NAME} (必需)" SecMain
            SectionIn RO
            
            SetOutPath "`$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            
            ; 写入注册表
            WriteRegStr HKLM "Software\`${APP_NAME}" "InstallDir" "`$INSTDIR"
            WriteRegStr HKLM "Software\`${APP_NAME}" "Version" "`${APP_VERSION}"
            
            ; 创建卸载程序
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
            
            ; 添加到控制面板的程序列表
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "DisplayName" "`${APP_NAME}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "UninstallString" "`$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "DisplayIcon" "`$INSTDIR\`${APP_EXE}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "Publisher" "`${APP_PUBLISHER}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "DisplayVersion" "`${APP_VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "HelpLink" "`${APP_SUPPORT_URL}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "URLInfoAbout" "`${APP_URL}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "URLUpdateInfo" "`${APP_UPDATES_URL}"
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "NoModify" 1
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}" "NoRepair" 1
          SectionEnd
          
          ; 开始菜单快捷方式
          Section "开始菜单快捷方式" SecStartMenu
            CreateDirectory "`$SMPROGRAMS\`${APP_NAME}"
            CreateShortCut "`$SMPROGRAMS\`${APP_NAME}\`${APP_NAME}.lnk" "`$INSTDIR\`${APP_EXE}"
            CreateShortCut "`$SMPROGRAMS\`${APP_NAME}\卸载 `${APP_NAME}.lnk" "`$INSTDIR\Uninstall.exe"
          SectionEnd
          
          ; 桌面快捷方式
          Section "桌面快捷方式" SecDesktop
            CreateShortCut "`$DESKTOP\`${APP_NAME}.lnk" "`$INSTDIR\`${APP_EXE}"
          SectionEnd
          
          ; 安装后运行程序
          Section "安装完成后运行 `${APP_NAME}" SecRunAfter
            Exec "`$INSTDIR\`${APP_EXE}"
          SectionEnd
          
          ; 卸载部分
          Section "Uninstall"
            ; 删除文件
            RMDir /r "`$INSTDIR"
            
            ; 删除快捷方式
            Delete "`$DESKTOP\`${APP_NAME}.lnk"
            RMDir /r "`$SMPROGRAMS\`${APP_NAME}"
            
            ; 删除注册表项
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${APP_NAME}"
            DeleteRegKey HKLM "Software\`${APP_NAME}"
          SectionEnd
          "@
          
          $script | Out-File -FilePath "setup.nsi" -Encoding UTF8
          Write-Host "✓ NSIS 脚本创建完成"
          
          # 显示创建的脚本内容（调试用）
          Write-Host "脚本内容预览:"
          Write-Host "==============="
          Get-Content "setup.nsi" | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
          Write-Host "==============="

      # 9) 使用 NSIS 创建安装程序
      - name: Create Installer with NSIS
        shell: pwsh
        run: |
          Write-Host "使用 NSIS 创建安装程序..."
          
          # 查找 NSIS 编译器
          $compilerPaths = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          )
          
          $compiler = $null
          foreach ($path in $compilerPaths) {
            if (Test-Path $path) {
              $compiler = $path
              Write-Host "✓ 找到 NSIS 编译器: $compiler"
              break
            }
          }
          
          if (-not $compiler) {
            Write-Error "未找到 NSIS 编译器"
            Write-Host "尝试的路径:"
            $compilerPaths | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          
          # 验证脚本文件存在
          if (-not (Test-Path "setup.nsi")) {
            Write-Error "setup.nsi 脚本文件不存在"
            exit 1
          }
          
          Write-Host "使用编译器: $compiler"
          Write-Host "编译脚本: setup.nsi"
          
          # 编译安装程序
          try {
            & $compiler "/V3" "setup.nsi"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "NSIS 编译失败，退出代码: $LASTEXITCODE"
              exit 1
            }
            Write-Host "✓ 安装程序编译成功"
          } catch {
            Write-Error "编译过程中发生错误: $($_.Exception.Message)"
            exit 1
          }
          
          # 验证安装程序文件
          $installerPath = "build\windows\installer\cc-chat-setup.exe"
          if (Test-Path $installerPath) {
            $fileInfo = Get-Item $installerPath
            Write-Host "✓ 安装程序创建成功: $installerPath"
            Write-Host "  文件大小: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          } else {
            Write-Error "安装程序文件未生成: $installerPath"
            Write-Host "输出目录内容:"
            if (Test-Path "build\windows\installer") {
              Get-ChildItem "build\windows\installer" | ForEach-Object { Write-Host "  - $($_.Name)" }
            } else {
              Write-Host "  输出目录不存在"
            }
            exit 1
          }

      # 10) 压缩可执行文件目录（用于便携版）
      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Write-Host "创建便携版压缩包（包含运行时库）..."
          New-Item -ItemType Directory -Force -Path "build\windows\portable" | Out-Null
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "build\windows\portable\" -Recurse
          Compress-Archive -Path "build\windows\portable\*" -DestinationPath "cc-chat-portable.zip"

      # 10.5) 输出便携版运行环境说明（安全写法，避免 PowerShell 解析错误）
      - name: Portable Runtime Notes
        shell: pwsh
        run: |
          $notes = @'
          便携版运行环境说明:
          - 已在构建机安装 VC++ 运行时 (vcredist140)
          - 若目标机器缺少运行时，可使用以下方式安装:
            Winget: winget install --id "Microsoft.VCRedist.2015+.x64" -e --accept-package-agreements --accept-source-agreements
            Offline: https://aka.ms/vs/17/release/vc_redist.x64.exe
          '@
          $notes -split "`n" | ForEach-Object { Write-Host $_ }

      # 11) 上传安装程序
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-chat-installer
          path: build/windows/installer/cc-chat-setup.exe

      # 12) 上传便携版压缩包
      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cc-chat-portable
          path: cc-chat-portable.zip