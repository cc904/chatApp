name: Build Flutter Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # 1) 检出源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2) 配置 Flutter（缓存可显著提速）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3) 启用 Windows 桌面支持
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # 4) 安装依赖
      - name: Install dependencies
        run: flutter pub get

      # 5) 构建 Windows Release 版本
      - name: Build Windows
        run: flutter build windows --release

      # 6) 安装 Inno Setup
      - name: Install Inno Setup
        shell: pwsh
        run: |
          Write-Host "安装 Inno Setup..."
          # 使用 Chocolatey 安装 Inno Setup
          choco install innosetup -y
          
          # 验证安装
          $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $innoPath) {
            Write-Host "✓ Inno Setup 安装成功"
            
            # 检查中文语言文件是否存在
            $chineseLangFile = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
            if (Test-Path $chineseLangFile) {
              Write-Host "✓ 中文语言文件已存在"
            } else {
              Write-Host "⚠ 中文语言文件不存在，将使用英文界面"
              Write-Host "语言文件路径: $chineseLangFile"
              
              # 列出可用的语言文件
              $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
              if (Test-Path $langDir) {
                Write-Host "可用的语言文件:"
                Get-ChildItem $langDir -Filter "*.isl" | ForEach-Object { Write-Host "  - $($_.Name)" }
              }
            }
            
            & $innoPath
          } else {
            Write-Error "Inno Setup 安装失败！"
            exit 1
          }

      # 7) 验证构建文件是否存在
      - name: Verify Build Files
        shell: pwsh
        run: |
          if (-not (Test-Path "build\windows\x64\runner\Release\ThisApp.exe")) {
            Write-Error "构建的可执行文件不存在！"
            exit 1
          }
          Write-Host "✓ 构建文件验证通过"

      # 8) 创建 Inno Setup 脚本
      - name: Create Inno Setup Script
        shell: pwsh
        run: |
          Write-Host "创建 Inno Setup 脚本..."
          
          # 确保输出目录存在
          New-Item -ItemType Directory -Force -Path "build\windows\installer"
          
          # 检查源文件目录
          $sourceDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $sourceDir)) {
            Write-Error "源文件目录不存在: $sourceDir"
            exit 1
          }
          
          Write-Host "源文件目录: $sourceDir"
          Get-ChildItem $sourceDir | ForEach-Object { Write-Host "  - $($_.Name)" }
          
          # 检查中文语言文件是否存在
          $chineseLangFile = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          $hasChineseSupport = Test-Path $chineseLangFile
          
          if ($hasChineseSupport) {
            Write-Host "✓ 将创建支持中英文的安装程序"
            $languageSection = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
          } else {
            Write-Host "⚠ 将创建仅支持英文的安装程序"
            $languageSection = @"
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
          }
          
          $script = @"
          [Setup]
          AppName=CC Chat
          AppVersion=1.0.2
          AppPublisher=CC Team
          AppPublisherURL=https://github.com/your-org/cc
          AppSupportURL=https://github.com/your-org/cc/issues
          AppUpdatesURL=https://github.com/your-org/cc/releases
          DefaultDirName={autopf}\CC Chat
          DefaultGroupName=CC Chat
          AllowNoIcons=yes
          OutputDir=build\windows\installer
          OutputBaseFilename=cc-chat-setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          WizardStyle=modern
          
          $languageSection
          
          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
          Name: "quicklaunchicon"; Description: "{cm:CreateQuickLaunchIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked; OnlyBelowVersion: 6.1
          
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\CC Chat"; Filename: "{app}\ThisApp.exe"
          Name: "{group}\{cm:UninstallProgram,CC Chat}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\CC Chat"; Filename: "{app}\ThisApp.exe"; Tasks: desktopicon
          Name: "{userappdata}\Microsoft\Internet Explorer\Quick Launch\CC Chat"; Filename: "{app}\ThisApp.exe"; Tasks: quicklaunchicon
          
          [Run]
          Filename: "{app}\ThisApp.exe"; Description: "{cm:LaunchProgram,CC Chat}"; Flags: nowait postinstall skipifsilent
          
          [UninstallDelete]
          Type: filesandordirs; Name: "{app}"
          "@
          
          $script | Out-File -FilePath "setup.iss" -Encoding UTF8
          Write-Host "✓ Inno Setup 脚本创建完成"
          
          # 显示创建的脚本内容（调试用）
          Write-Host "脚本内容预览:"
          Write-Host "==============="
          Get-Content "setup.iss" | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
          Write-Host "==============="

      # 9) 使用 Inno Setup 创建安装程序
      - name: Create Installer with Inno Setup
        shell: pwsh
        run: |
          Write-Host "准备创建安装程序..."
          
          # 检查 Inno Setup 是否存在
          $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $innoPath)) {
            Write-Error "Inno Setup 编译器未找到: $innoPath"
            
            # 尝试查找其他可能的路径
            $altPaths = @(
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\tools\innosetup\ISCC.exe"
            )
            
            foreach ($path in $altPaths) {
              if (Test-Path $path) {
                $innoPath = $path
                Write-Host "找到 Inno Setup: $innoPath"
                break
              }
            }
            
            if (-not (Test-Path $innoPath)) {
              Write-Error "无法找到 Inno Setup 编译器！"
              exit 1
            }
          }
          
          Write-Host "使用 Inno Setup: $innoPath"
          
          # 检查脚本文件
          if (-not (Test-Path "setup.iss")) {
            Write-Error "setup.iss 文件不存在！"
            exit 1
          }
          
          Write-Host "开始编译安装程序..."
          try {
            & $innoPath setup.iss
            $exitCode = $LASTEXITCODE
            
            if ($exitCode -ne 0) {
              Write-Error "Inno Setup 编译失败，退出码: $exitCode"
              exit 1
            }
          } catch {
            Write-Error "执行 Inno Setup 时发生错误: $($_.Exception.Message)"
            exit 1
          }
          
          # 验证输出文件
          $installerPath = "build\windows\installer\cc-chat-setup.exe"
          if (-not (Test-Path $installerPath)) {
            Write-Error "安装程序文件未生成: $installerPath"
            
            # 列出输出目录内容
            if (Test-Path "build\windows\installer") {
              Write-Host "输出目录内容:"
              Get-ChildItem "build\windows\installer" | ForEach-Object { Write-Host "  - $($_.Name)" }
            }
            exit 1
          }
          
          $fileSize = (Get-Item $installerPath).Length / 1MB
          Write-Host "✓ 安装程序创建成功: $installerPath (大小: $([math]::Round($fileSize, 2)) MB)"

      # 10) 压缩可执行文件目录（用于便携版）
      - name: Create Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build\windows\portable"
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "build\windows\portable\" -Recurse
          Compress-Archive `
            -Path "build\windows\portable\*" `
            -DestinationPath "cc-chat-portable.zip"

      # 11) 上传安装程序
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-chat-installer
          path: build/windows/installer/cc-chat-setup.exe

      # 12) 上传便携版压缩包
      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cc-chat-portable
          path: cc-chat-portable.zip