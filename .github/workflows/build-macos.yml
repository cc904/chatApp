name: Build Flutter macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Archive .app
        run: |
          mkdir -p build/macos/artifacts
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app build/macos/artifacts/macos-app.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/artifacts/macos-app.zip


