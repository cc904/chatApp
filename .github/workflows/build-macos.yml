name: Build Flutter macOS

on:
  push:
    branches: [ 123 ]
  pull_request:
    branches: [ 123 ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter Pub Get
        run: flutter pub get

      - name: CocoaPods Repo Update (ios & macos)
        run: |
          sudo gem install cocoapods --no-document || true
          pod --version
          (cd ios && pod repo update || true)
          (cd macos && pod repo update || true)

      - name: Pod Install with Repo Update (ios & macos)
        run: |
          (cd ios && pod install --repo-update)
          (cd macos && pod install --repo-update)

      - name: Build macOS App
        run: flutter build macos --release

      - name: Archive .app
        run: |
          mkdir -p build/macos/artifacts
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app build/macos/artifacts/macos-app.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/artifacts/macos-app.zip


