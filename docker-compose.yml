services:
  # Flutter Web 应用 (Release版本)
  flutter-web:
    image: x0x-chatapp:latest
    container_name: x0x-chatapp
    ports:
      - "8004:80"    # HTTP (映射到8004避免冲突)
      - "8005:443"   # HTTPS
    user: "1000:1000"  # 指定UID:GID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - ENABLE_HTTPS=false  # 默认禁用HTTPS，避免证书问题
      - APP_NAME=Flutter Web App
      - APP_VERSION=1.0.0
      - EXTERNAL_HTTP_PORT=8004    # 外部HTTP访问端口
      - EXTERNAL_HTTPS_PORT=8005   # 外部HTTPS访问端口
      - EXTERNAL_HOST=${EXTERNAL_HOST:-localhost}    # 外部访问主机，可通过环境变量覆盖
    # volumes:
      # 可选：如果有SSL证书才挂载
      # - ./ssl-certs:/app/ssl-certs:ro
    networks:
      - flutter-network

  # Flutter Web Debug版本
  flutter-web-debug:
    image: x0x-chatapp:debug
    container_name: x0x-chatapp-debug
    ports:
      - "9004:80"    # HTTP Debug
      - "9005:443"   # HTTPS Debug
    user: "1000:1000"  # 指定UID:GID
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - ENABLE_HTTPS=false  # 默认禁用HTTPS
      - APP_NAME=Flutter Web App (Debug)
      - APP_VERSION=1.0.0-debug
      - EXTERNAL_HTTP_PORT=9004    # 外部HTTP访问端口
      - EXTERNAL_HTTPS_PORT=9005   # 外部HTTPS访问端口
      - EXTERNAL_HOST=${EXTERNAL_HOST:-localhost}    # 外部访问主机，可通过环境变量覆盖
    # volumes:
      # - ./ssl-certs:/app/ssl-certs:ro
    networks:
      - flutter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  flutter-network:
    driver: bridge

# 使用方法:
# 1. 同时运行两个版本: docker-compose up
#    Release版本: http://${EXTERNAL_HOST:-localhost}:8004
#    Debug版本:   http://${EXTERNAL_HOST:-localhost}:9004
# 2. 只运行Release版本: docker-compose up flutter-web
# 3. 只运行Debug版本: docker-compose up flutter-web-debug
# 4. 后台运行: docker-compose up -d
# 5. 查看日志: docker-compose logs -f
# 6. 停止服务: docker-compose down
#
# 配置外部访问地址:
# - 本地开发: EXTERNAL_HOST=localhost docker-compose up
# - 服务器部署: EXTERNAL_HOST=192.168.1.100 docker-compose up  
# - 域名部署: EXTERNAL_HOST=your-domain.com docker-compose up