services:
# Flutter Web 应用 (Release版本)
  flutter-web:
    image: x0x-chatapp:latest
    container_name: x0x-chatapp
    ports:
      - "7002:80"    # HTTP (chatapp使用7002端口)
      # - "7004:443"   # HTTPS
    # user配置已移至Dockerfile中
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    # 环境变量 (开发/测试环境硬编码值)
    # 注意: 容器内程序直接使用这些环境变量，不读取.env文件
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - ENABLE_HTTPS=false  # 默认禁用HTTPS，避免证书问题
      - APP_NAME=Flutter Web App
      - APP_VERSION=1.0.0
      - FONT_SERVICE_URL=https://popoopoo.com:7000  # 开发环境字体服务地址
    # volumes:
      # 可选：如果有SSL证书才挂载
      # - ./ssl-certs:/app/ssl-certs:ro
    networks:
      - flutter-network


volumes:
  font-cache-dev:
    driver: local

networks:
  flutter-network:
    driver: bridge

# 使用方法:
# 1. 同时运行所有服务: docker-compose up
#    字体服务:     http://localhost:7000
#    Release版本:  http://localhost:7002
#    Debug版本:    http://localhost:7003
# 2. 只运行Release版本: docker-compose up flutter-web
# 3. 只运行Debug版本: docker-compose up flutter-web-debug
# 4. 后台运行: docker-compose up -d
# 5. 查看日志: docker-compose logs -f
# 6. 停止服务: docker-compose down
#
# 配置外部访问地址:
# - 本地开发: EXTERNAL_HOST=localhost docker-compose up
# - 服务器部署: EXTERNAL_HOST=192.168.1.100 docker-compose up  
# - 域名部署: EXTERNAL_HOST=your-domain.com docker-compose up