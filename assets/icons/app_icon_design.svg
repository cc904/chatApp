<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for modern look -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07C160;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06A94F;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offset"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="512" cy="512" r="480" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- Chat bubble main -->
  <g transform="translate(512, 512)">
    <!-- Main chat bubble -->
    <path d="M -160 -120 L 160 -120 Q 200 -120 200 -80 L 200 40 Q 200 80 160 80 L -40 80 L -120 140 Q -140 155 -160 140 L -160 120 L -160 -80 Q -160 -120 -120 -120 Z" 
          fill="#FFFFFF" 
          opacity="0.95"/>
    
    <!-- Secondary smaller bubble -->
    <path d="M 80 60 L 180 60 Q 200 60 200 80 L 200 120 Q 200 140 180 140 L 140 140 L 120 160 Q 110 170 100 160 L 100 150 L 100 80 Q 100 60 120 60 Z" 
          fill="#FFFFFF" 
          opacity="0.8"/>
    
    <!-- Message lines in main bubble -->
    <rect x="-120" y="-80" width="240" height="12" rx="6" fill="#07C160" opacity="0.6"/>
    <rect x="-120" y="-50" width="180" height="12" rx="6" fill="#07C160" opacity="0.4"/>
    <rect x="-120" y="-20" width="200" height="12" rx="6" fill="#07C160" opacity="0.3"/>
    
    <!-- Message lines in secondary bubble -->
    <rect x="120" y="80" width="60" height="8" rx="4" fill="#07C160" opacity="0.4"/>
    <rect x="120" y="100" width="40" height="8" rx="4" fill="#07C160" opacity="0.3"/>
  </g>
  
  <!-- Subtle highlight for gloss effect -->
  <ellipse cx="420" cy="350" rx="80" ry="40" fill="#FFFFFF" opacity="0.2"/>
</svg>